name: "Update Firefox addons"
on:
  schedule:
    - cron: "0 19 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
      - name: Update Firefox addons
        run: |
          nix run git+https://git.sr.ht/~rycee/mozilla-addons-to-nix -- \
            pkgs/firefox-addons/addons.json pkgs/firefox-addons/default.nix
      - name: Create pull request
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          commit-message: "chore: update Firefox addons"
          title: "chore: update Firefox addons"
          body: "Automated update of Firefox addons via `mozilla-addons-to-nix`."
          branch: update/firefox-addons
      # AIDEV-NOTE: unconditional so a PR that lost auto-merge (e.g. a ruleset
      # change) gets it back on the next run, not only when the diff changes.
      - name: Enable auto-merge
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh pr merge --auto --squash \
            --repo "${{ github.repository }}" \
            "${{ steps.cpr.outputs.pull-request-number }}"
